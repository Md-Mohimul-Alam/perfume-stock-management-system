<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Basic -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>LUXE Perfume Management</title>

    <meta
      name="description"
      content="LUXE Perfume Stock, Sales, Inventory and Business Management System"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#111111"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- Browser Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/icon-512.png"
    />

    <!-- Apple Touch Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icons/apple-touch-icon-180x180.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="/apple-touch-icons/apple-touch-icon-167x167.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/apple-touch-icons/apple-touch-icon-152x152.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/apple-touch-icons/apple-touch-icon-120x120.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="76x76"
      href="/apple-touch-icons/apple-touch-icon-76x76.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="/apple-touch-icons/apple-touch-icon-57x57.png"
    />

    <!-- Default Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icons/apple-touch-icon.png"
    />

    <!-- iOS Web App -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="LUXE"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Android / PWA -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="LUXE Perfume Management"
    />

    <meta
      property="og:description"
      content="LUXE Perfume Stock, Sales, Inventory and Business Management System"
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- Prevent unwanted phone-number detection -->
    <meta
      name="format-detection"
      content="telephone=no"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
