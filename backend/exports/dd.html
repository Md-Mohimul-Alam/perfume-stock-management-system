<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfume Price List - BDT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fb;
      padding: 2rem 1.5rem;
      color: #1e293b;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e9edf2;
    }
    .filters label {
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .filters select, .filters input {
      padding: 0.3rem 0.6rem;
      border: 1px solid #d1d9e6;
      border-radius: 8px;
      background: white;
      font-size: 0.9rem;
    }
    .table-wrapper {
      overflow-x: auto;
      margin-top: 0.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 900px;
    }
    th, td {
      padding: 0.6rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid #eef2f6;
      white-space: nowrap;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      color: #0f172a;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tr:hover td {
      background: #fafcff;
    }
    .product-name {
      font-weight: 500;
      color: #0f172a;
    }
    .sku {
      font-family: monospace;
      font-size: 0.8rem;
      color: #64748b;
    }
    .type-badge {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .type-roll-on { background: #e0f2fe; color: #0369a1; }
    .type-spray { background: #dbeafe; color: #1d4ed8; }
    .price {
      font-weight: 500;
      color: #0f172a;
      /* Removed ::before content: '$' */
    }
    .empty-cell {
      color: #94a3b8;
      font-size: 0.8rem;
      text-align: center;
    }
    .intensity, .bestfor, .notes {
      font-size: 0.8rem;
      color: #475569;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      background: #e9edf2;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      color: #334155;
      margin-right: 0.2rem;
    }
    .toggle-details {
      cursor: pointer;
      color: #2563eb;
      font-size: 0.8rem;
      text-decoration: underline dotted;
    }
    .detail-row td {
      padding: 0.8rem 1rem;
      background: #f9fafc;
      font-size: 0.85rem;
      color: #334155;
      white-space: normal;
      word-break: break-word;
    }
    .detail-row .desc {
      max-width: 400px;
    }
    .footnote {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e9edf2;
      font-size: 0.85rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .container { padding: 1rem; }
      th, td { padding: 0.4rem 0.5rem; font-size: 0.8rem; }
      .filters { flex-direction: column; align-items: stretch; }
      .product-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
    }
  </style>
</head>

<div class="container">
  <h1>🧴 Perfume Price List</h1>
  <div class="subtitle">All products with sizes and prices – Roll‑on & Spray (Prices in BDT)</div>

  <div class="filters">
    <label>Type:
      <select id="typeFilter">
        <option value="all">All</option>
        <option value="roll-on">Roll‑on</option>
        <option value="spray">Spray</option>
      </select>
    </label>
    <label>Intensity:
      <select id="intensityFilter">
        <option value="all">All</option>
        <option value="light">Light</option>
        <option value="medium">Medium</option>
        <option value="strong">Strong</option>
      </select>
    </label>
    <label>Search:
      <input type="text" id="searchInput" placeholder="name or sku..." />
    </label>
  </div>

  <div class="table-wrapper">
    <table id="priceTable">
      <thead>

          <th>SKU</th>
          <th>Type</th>
          <th>Intensity</th>
          <th>Best For</th>
          <th>Notes</th>

          <th data-size="15">15 ml</th>
          <th data-size="30">30 ml</th>
          <th data-size="50">50 ml</th>
          <th data-size="100">100 ml</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- rows inserted by JS -->
      </tbody>
    </table>
  </div>
  <div class="footnote">
    <span>Showing <span id="rowCount">0</span> products</span>
    <span>All prices are in <strong>BDT</strong> (Bangladeshi Taka)</span>
  </div>
</div>

  // ----- PROCESS DATA -----
  const sizeColumns = [3.5, 6, 15, 30, 50, 100];
  const productMap = new Map();

  productsData.forEach(item => {
    const key = item.name + '|' + item.type;
    if (!productMap.has(key)) {
      productMap.set(key, {
        name: item.name,
        sku: item.sku,
        type: item.type,
        intensity: item.intensity,
        bestFor: Array.isArray(item.bestFor) ? item.bestFor.join(', ') : item.bestFor || '',
        notes: Array.isArray(item.notes) ? item.notes.join(', ') : item.notes || '',
        description: item.description || '',
        sizes: {}
      });
    }
    const entry = productMap.get(key);
    if (!entry.sku) entry.sku = item.sku;
    entry.sizes[item.sizeMl] = item.sellingPrice;
  });

  const products = Array.from(productMap.values());

  // ----- RENDER TABLE -----
  function renderTable(filterType = 'all', filterIntensity = 'all', searchTerm = '') {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = ''; // clear
    let count = 0;

    products.forEach(p => {
      const typeMatch = filterType === 'all' || p.type === filterType;
      const intensityMatch = filterIntensity === 'all' || p.intensity === filterIntensity;
      const searchLower = searchTerm.toLowerCase();
      const nameMatch = p.name.toLowerCase().includes(searchLower) || p.sku.toLowerCase().includes(searchLower);
      if (!typeMatch || !intensityMatch || !nameMatch) return;

      count++;
      const tr = document.createElement('tr');

      // Product name
      const tdName = document.createElement('td');
      tdName.className = 'product-name';
      tdName.textContent = p.name;

      // SKU
      const tdSku = document.createElement('td');
      tdSku.className = 'sku';
      tdSku.textContent = p.sku;

      // Type badge
      const tdType = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = `type-badge type-${p.type}`;
      badge.textContent = p.type;
      tdType.appendChild(badge);

      // Intensity
      const tdIntensity = document.createElement('td');
      tdIntensity.className = 'intensity';
      tdIntensity.textContent = p.intensity || '—';

      // Best For
      const tdBest = document.createElement('td');
      tdBest.className = 'bestfor';
      tdBest.textContent = p.bestFor || '—';

      // Notes
      const tdNotes = document.createElement('td');
      tdNotes.className = 'notes';
      tdNotes.textContent = p.notes || '—';

      // Size columns (prices in BDT with thousand separators)
      const sizeCells = sizeColumns.map(ml => {
        const td = document.createElement('td');
        const price = p.sizes[ml];
        if (price !== undefined && price !== null) {
          td.className = 'price';
          // Format as BDT: e.g., 1,250 BDT
          td.textContent = price.toLocaleString() + ' BDT';
        } else {
          td.className = 'empty-cell';
          td.textContent = '—';
        }
        return td;
      });

      // Details toggle
      const tdDetails = document.createElement('td');
      const toggle = document.createElement('span');
      toggle.className = 'toggle-details';
      toggle.textContent = 'Show';
      toggle.style.cursor = 'pointer';
      tdDetails.appendChild(toggle);

      // Append all cells
      tr.appendChild(tdName);
      tr.appendChild(tdSku);
      tr.appendChild(tdType);
      tr.appendChild(tdIntensity);
      tr.appendChild(tdBest);
      tr.appendChild(tdNotes);
      sizeCells.forEach(td => tr.appendChild(td));
      tr.appendChild(tdDetails);

      // Detail row (hidden initially)
      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.style.display = 'none';
      const detailTd = document.createElement('td');
      detailTd.colSpan = 13;
      detailTd.innerHTML = `<div class="desc"><strong>Description:</strong> ${p.description || 'No description'}</div>`;
      detailTr.appendChild(detailTd);

      tbody.appendChild(tr);
      tbody.appendChild(detailTr);

      // Toggle detail visibility
      let visible = false;
      toggle.addEventListener('click', () => {
        visible = !visible;
        detailTr.style.display = visible ? 'table-row' : 'none';
        toggle.textContent = visible ? 'Hide' : 'Show';
      });
    });

    document.getElementById('rowCount').textContent = count;
  }

  // ----- INITIAL RENDER -----
  renderTable();

  // ----- FILTERS -----
  document.getElementById('typeFilter').addEventListener('change', applyFilters);
  document.getElementById('intensityFilter').addEventListener('change', applyFilters);
  document.getElementById('searchInput').addEventListener('input', applyFilters);

  function applyFilters() {
    const type = document.getElementById('typeFilter').value;
    const intensity = document.getElementById('intensityFilter').value;
    const search = document.getElementById('searchInput').value;
    renderTable(type, intensity, search);
  }
